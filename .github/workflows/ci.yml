name: CI/CD Pipeline - Agent BI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-test-secret-key-change-me-32-chars
      LLM_PROVIDER: mock
      LLM_FALLBACK_PROVIDERS: mock
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run repository quality gate (blocking)
      shell: pwsh
      run: |
        ./scripts/sprint0_quality_gate.ps1 -Mode gate
    
    - name: Run syntax checks
      run: |
        cd backend
        python -m compileall app/
    
    - name: Run linting
      run: |
        cd backend
        pip install flake8
        # The legacy app has an existing style and static-analysis backlog.
        # Keep this gate focused on syntax errors; broader cleanup is separate.
        flake8 app/ --max-line-length=120 --select=E9,F63 --exclude=__pycache__,migrations
    
    - name: Run Sprint 1 contract tests (pull request)
      if: github.event_name == 'pull_request'
      run: |
        cd backend
        pip install pytest pytest-asyncio
        pytest tests/test_transfers_contract.py -v --tb=short

    - name: Run full backend tests (main/develop)
      if: github.event_name != 'pull_request'
      run: |
        cd backend
        pip install pytest pytest-cov
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

    - name: Run domain eval gate
      if: github.event_name != 'pull_request'
      run: |
        cd backend
        pytest tests/llmops/test_domain_eval_gate.py -v --tb=short

    - name: Run capability targets gate
      if: github.event_name != 'pull_request'
      run: |
        cd backend
        pytest tests/llmops/test_capability_targets.py -v --tb=short
    
    - name: Check Sprint 1 security (pull request)
      if: github.event_name == 'pull_request'
      run: |
        cd backend
        pip install bandit
        # B608 is a known low-confidence false positive for this allowlisted query.
        bandit -r app/api/v1/endpoints/transfers.py -ll --skip B608

    - name: Check full security (main/develop)
      if: github.event_name != 'pull_request'
      run: |
        cd backend
        pip install bandit
        bandit -r app/ -ll

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        cd frontend-solid
        bun install

    - name: Build frontend
      run: |
        cd frontend-solid
        bun run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend-solid/dist/

  deploy-staging:
    name: Deploy to Staging
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploy to staging environment"
        # Adicionar comandos de deploy aqui
        # Exemplo: scp, rsync, docker push, etc.

  deploy-production:
    name: Deploy to Production
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploy to production environment"
        # Adicionar comandos de deploy aqui
        # Exemplo: scp, rsync, docker push, etc.
    
    - name: Create release tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        VERSION=$(date +%Y.%m.%d-%H%M)
        git tag -a "v$VERSION" -m "Release $VERSION"
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
