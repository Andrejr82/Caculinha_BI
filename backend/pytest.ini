[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --ignore=scripts --ignore=backend/scripts
markers =
    manual: teste manual que depende de ambiente local.
    external: teste com dependência externa (API, serviço, credencial).
    load: teste de carga/desempenho.
    integration: teste de integração.
    realdata: teste que consulta dados reais do parquet/banco.
    legacy: teste legado em quarentena (opt-in).
    e2e: teste end-to-end.
filterwarnings =
    # Ignorar warnings de site-packages
    ignore:.*:DeprecationWarning:.*site-packages.*
    ignore:.*:UserWarning:.*site-packages.*
    # Filtro específico para classe de erro do Pydantic (PyIceberg)
    ignore::pydantic.warnings.PydanticDeprecatedSince212
    # SWIG
    ignore:.*builtin type SwigPy.*:DeprecationWarning
    ignore:.*builtin type swigvarlink.*:DeprecationWarning
